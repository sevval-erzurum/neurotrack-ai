name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://test:test@localhost:5432/test' || 'sqlite://' }}
        run: pytest
      - name: Migrations apply cleanly
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: |
          python -c "from app.core.db import Base, engine; from app import models; Base.metadata.drop_all(engine)"
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      # LayoutProps gibi rota tipleri Next tarafından üretilir; tsc'den önce oluşturulmalı.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-secret-not-used-for-anything-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eu
          base=http://localhost:3000
          until curl -sf -o /dev/null "$base/"; do sleep 2; done
          for path in / /login /register /model; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"; test "$code" = 200
          done
          # Model kartı sunucu tarafında API'den çekiliyor: içerik HTML'de olmalı.
          curl -sf "$base/model" | grep -q "AUC (nested CV)"
          # Oturumsuz panel isteği girişe yönlenmeli.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/dashboard")" = 307
          # Demo hesapla giriş, Next.js API proxy'si üzerinden (aynı origin) ve cookie.
          curl -sf -c jar -H 'content-type: application/json' \
            -d '{"email":"ebeveyn@example.com","password":"demo1234"}' "$base/api/v1/auth/login" > /dev/null
          curl -sf -b jar "$base/api/v1/auth/me" | grep -q '"role":"parent"'
          curl -sf -b jar "$base/api/v1/subjects" | grep -q '"kind":"child"'
          # Ebeveyn yönetim uçlarına erişemez; yönetici erişir ama sağlık verisi göremez.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar "$base/api/v1/admin/overview")" = 403
          curl -sf -c admin -H 'content-type: application/json' \
            -d '{"email":"yonetici@example.com","password":"demo1234"}' "$base/api/v1/auth/login" > /dev/null
          curl -sf -b admin "$base/api/v1/admin/doctors?status=pending" | grep -q 'bekleyen.doktor@example.com'
          test "$(curl -s -b admin "$base/api/v1/subjects")" = "[]"
          # Erişim günlüğü yazılıyor.
          curl -sf -b admin "$base/api/v1/admin/audit?action=auth.login" | grep -q '"auth.login"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
